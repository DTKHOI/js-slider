<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slidezy</title>
    <link rel="stylesheet" href="./src/slidezy.css" />
    <style>
      .slidezy-slide {
        padding: 30px;
        text-align: center;
      }

      .slidezy-slide:nth-child(odd) {
        background: orange;
      }

      .slidezy-slide:nth-child(even) {
        background: green;
      }

      .slidezy-prev,
      .slidezy-next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        outline: none;
        color: #fff;
        font-weight: 600;
        padding: 10px;
        background: rgba(0, 0, 0, 0.3);
      }

      .slidezy-prev {
        left: 10px;
      }

      .slidezy-next {
        right: 10px;
      }
    </style>
  </head>
  <body>
    <!-- cấu trúc html ban đầu -->
    <div id="my-slider">
      <div>slide 1</div>
      <div>slide 2</div>
      <div>slide 3</div>
      <div>slide 4</div>
      <div>slide 5</div>
      <div>slide 6</div>
    </div>
    <button class="next-button">Prev</button>
    <button class="prev-button">Next</button>
    <script src="./src/slidezy.js"></script>
    <script>
      const mySlider = new Slidezy("#my-slider", {
        loop: true,
        items: 3,
        nextButton: ".next-button",
        prevButton: ".prev-button",
        slideBy: 2,
      });
    </script>
  </body>
</html>
